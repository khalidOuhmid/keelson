id: scorecard
name: 'OpenSSF Scorecard'
kind: job
layers: [supply-chain]
license: Apache-2.0
homepage: https://github.com/ossf/scorecard
verifiedAt: https://github.com/ossf/scorecard
logo: null
detect:
  images: ['ossf/scorecard']
  scripts: ['\bscorecard\s+--repo\b']
snippets:
  gitlab: null
  github: |
    - name: Run OpenSSF Scorecard
      run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/ossf/scorecard:latest --repo=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
lastVerified: 2026-11-04
