id: scorecard
name: 'OpenSSF Scorecard'
kind: job
layers: [supply-chain]
license: Apache-2.0
homepage: https://github.com/ossf/scorecard
verifiedAt: https://github.com/ossf/scorecard
logo: null
detect:
  images: ['ossf/scorecard']
  scripts: ['\bscorecard(?::\S+)?\s+--repo\b']
  actions: ['ossf/scorecard-action']
snippets:
  gitlab: null
  github: |
    - name: Run OpenSSF Scorecard
      run: docker run --rm -e GITHUB_AUTH_TOKEN ghcr.io/ossf/scorecard:latest --repo=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
      env:
        GITHUB_AUTH_TOKEN: ${{ github.token }}
lastVerified: 2026-11-04
